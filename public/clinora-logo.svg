<svg viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="clinora-bg" x1="0" y1="0" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#8B1E3F" />
      <stop offset="60%" stopColor="#7A1A37" />
      <stop offset="100%" stopColor="#4D1022" />
    </linearGradient>
    <linearGradient id="clinora-aura" x1="0" y1="0" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="50%" stopColor="#F9A8D4" />
      <stop offset="100%" stopColor="#DE4E76" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stopColor="#8B1E3F" />
      <stop offset="50%" stopColor="#DE4E76" />
      <stop offset="100%" stopColor="#7C3AED" />
    </linearGradient>
  </defs>

  <!-- Logo Mark Container -->
  <rect x="5" y="5" width="50" height="50" rx="16" fill="url(#clinora-bg)" filter="drop-shadow(0px 4px 12px rgba(139,30,63,0.35))" />

  <!-- Stylized 'C' Aura Arc -->
  <path d="M 40 16 C 34 11 21 12 15 21 C 8 30 10 43 19 49 C 27 54 39 52 45 43" 
        stroke="url(#clinora-aura)" stroke-width="4.5" stroke-linecap="round" fill="none" />

  <!-- Medical Cross Core -->
  <path d="M 30 20 L 30 40" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 20 30 L 40 30" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />

  <!-- Heartbeat Pulse Line -->
  <path d="M 22 30 L 26 30 L 28 25 L 31 35 L 34 30 L 38 30" 
        stroke="#10B981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Star Sparkle at Apex -->
  <path d="M 44 14 Q 45 17 48 18 Q 45 19 44 22 Q 43 19 40 18 Q 43 17 44 14 Z" fill="#FEE2E2" />

  <!-- 24x7 Pulse Dot -->
  <circle cx="47" cy="47" r="3.5" fill="#10B981" stroke="#8B1E3F" stroke-width="2" />

  <!-- Brand Typography -->
  <text x="68" y="38" font-family="Inter, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#1B1B1F">Clin<tspan fill="url(#text-grad)">ora</tspan></text>
  <text x="70" y="50" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#71717A">APPOINTMENTS THAT BOOK THEMSELVES</text>
</svg>
